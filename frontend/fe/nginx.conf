server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints everything under /assets, so it can be cached for a long time
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths (/cart, /auth, ...) are handled by React Router
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
